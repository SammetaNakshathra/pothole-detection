<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShockMap - Pothole Detection</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* MAP */

        #map {
            width: 100%;
            height: 100vh;
        }

        /* DASHBOARD */

        .dashboard {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.96);

            padding: 18px;

            border-radius: 14px;

            width: 240px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .dashboard h2 {
            margin: 0 0 12px 0;

            font-size: 23px;
        }

        .dashboard p {
            margin: 8px 0;
        }

        .count {
            font-size: 20px;
            font-weight: bold;
        }

        /* LEGEND */

        .legend {
            margin-top: 12px;
        }

        .legend-item {
            margin: 6px 0;
        }

        .legend-dot {
            display: inline-block;

            width: 13px;
            height: 13px;

            border-radius: 50%;

            margin-right: 7px;
        }

        .mild {
            background: green;
        }

        .moderate {
            background: orange;
        }

        .severe {
            background: red;
        }

        /* BUTTONS */

        .button-container {
            position: absolute;

            top: 20px;
            right: 20px;

            z-index: 1000;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        button {
            border: none;

            padding: 11px 16px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.25);
        }

        .voice-button {
            background: #222;
            color: white;
        }

        .location-button {
            background: #1976d2;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        /* STATUS */

        .status {
            margin-top: 12px;

            padding: 8px;

            border-radius: 7px;

            background: #f1f1f1;

            font-size: 12px;
        }

    </style>

</head>


<body>


    <!-- ========================================= -->
    <!-- DASHBOARD -->
    <!-- ========================================= -->

    <div class="dashboard">

        <h2>🚧 ShockMap</h2>

        <p>
            <strong>Total Potholes:</strong>
            <span id="count" class="count">0</span>
        </p>


        <div class="legend">

            <strong>Severity</strong>

            <div class="legend-item">
                <span class="legend-dot mild"></span>
                Mild
            </div>

            <div class="legend-item">
                <span class="legend-dot moderate"></span>
                Moderate
            </div>

            <div class="legend-item">
                <span class="legend-dot severe"></span>
                Severe
            </div>

        </div>


        <div id="status" class="status">
            System ready
        </div>

    </div>


    <!-- ========================================= -->
    <!-- BUTTONS -->
    <!-- ========================================= -->

    <div class="button-container">

        <button
            class="voice-button"
            onclick="enableVoice()">

            🔊 Enable Voice

        </button>


        <button
            class="location-button"
            onclick="findMyLocation()">

            📍 My Location

        </button>

    </div>


    <!-- ========================================= -->
    <!-- MAP -->
    <!-- ========================================= -->

    <div id="map"></div>


    <!-- Leaflet JavaScript -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>


        // ==================================================
        // 1. CREATE MAP
        // ==================================================

        const map = L.map("map").setView(
            [17.3850, 78.4867],
            13
        );


        // ==================================================
        // 2. OPEN STREET MAP
        // ==================================================

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // ==================================================
        // 3. MARKER LAYER
        // ==================================================

        const markersLayer =
            L.layerGroup().addTo(map);


        // ==================================================
        // 4. SAMPLE POTHOLE DATA
        // ==================================================
        //
        // This allows the GitHub Pages website to work
        // without requiring your Flask server.
        //
        // Later we can replace this with:
        //
        // fetch("YOUR_BACKEND_URL/api/potholes")
        //
        // ==================================================

        const potholes = [

            {
                latitude: 17.3850,
                longitude: 78.4867,
                severity: 2,
                timestamp: "2026-09-22 15:00"
            },

            {
                latitude: 17.3920,
                longitude: 78.4810,
                severity: 4,
                timestamp: "2026-09-22 15:05"
            },

            {
                latitude: 17.3780,
                longitude: 78.4920,
                severity: 6,
                timestamp: "2026-09-22 15:10"
            },

            {
                latitude: 17.4010,
                longitude: 78.4700,
                severity: 3,
                timestamp: "2026-09-22 15:15"
            },

            {
                latitude: 17.3710,
                longitude: 78.4750,
                severity: 5,
                timestamp: "2026-09-22 15:20"
            }

        ];


        // ==================================================
        // 5. GET COLOR BASED ON SEVERITY
        // ==================================================

        function getColor(severity) {

            if (severity >= 5) {

                return "red";

            }

            else if (severity >= 3) {

                return "orange";

            }

            else {

                return "green";

            }

        }


        // ==================================================
        // 6. GET SEVERITY TEXT
        // ==================================================

        function getSeverityText(severity) {

            if (severity >= 5) {

                return "Severe";

            }

            else if (severity >= 3) {

                return "Moderate";

            }

            else {

                return "Mild";

            }

        }


        // ==================================================
        // 7. LOAD POTHOLES ON MAP
        // ==================================================

        function loadPotholes(data) {


            // Remove old markers

            markersLayer.clearLayers();


            // Update counter

            document.getElementById("count").innerText =
                data.length;


            // Add markers

            data.forEach(function(pothole) {


                const color =
                    getColor(pothole.severity);


                const severityText =
                    getSeverityText(pothole.severity);


                const marker =
                    L.circleMarker(

                        [
                            pothole.latitude,
                            pothole.longitude
                        ],

                        {

                            color: color,

                            fillColor: color,

                            fillOpacity: 0.8,

                            radius: 9,

                            weight: 2

                        }

                    );


                marker.bindPopup(`

                    <div style="min-width:180px">

                        <h3 style="margin-top:0">
                            🚧 Pothole Detected
                        </h3>

                        <b>Severity:</b>
                        ${severityText}

                        <br><br>

                        <b>Severity Score:</b>
                        ${pothole.severity}

                        <br><br>

                        <b>Latitude:</b>
                        ${pothole.latitude}

                        <br>

                        <b>Longitude:</b>
                        ${pothole.longitude}

                        <br><br>

                        <b>Detected:</b>
                        ${pothole.timestamp}

                    </div>

                `);


                marker.addTo(markersLayer);

            });


            document.getElementById("status").innerText =
                "✅ Pothole data loaded";

        }


        // ==================================================
        // 8. LOAD INITIAL DATA
        // ==================================================

        loadPotholes(potholes);


        // ==================================================
        // 9. USER LOCATION MARKER
        // ==================================================

        let userMarker = null;


        // ==================================================
        // 10. FIND USER LOCATION
        // ==================================================

        function findMyLocation() {


            if (!navigator.geolocation) {

                alert(
                    "Geolocation is not supported by your browser."
                );

                return;

            }


            document.getElementById("status").innerText =
                "📍 Getting your location...";


            navigator.geolocation.getCurrentPosition(

                function(position) {


                    const userLat =
                        position.coords.latitude;


                    const userLon =
                        position.coords.longitude;


                    // Move map to user

                    map.setView(
                        [userLat, userLon],
                        16
                    );


                    // Remove old user marker

                    if (userMarker !== null) {

                        map.removeLayer(userMarker);

                    }


                    // Create new user marker

                    userMarker = L.marker(
                        [userLat, userLon]
                    )
                    .addTo(map);


                    userMarker
                        .bindPopup(
                            "<b>📍 You are here</b>"
                        )
                        .openPopup();


                    document.getElementById("status").innerText =
                        "📍 Location detected";


                    // Check nearby potholes

                    checkNearbyPotholes(

                        userLat,

                        userLon,

                        potholes

                    );

                },


                function(error) {


                    console.log(error);


                    document.getElementById("status").innerText =
                        "⚠️ Unable to get location";


                    alert(
                        "Please allow location access in your browser."
                    );

                },

                {

                    enableHighAccuracy: true,

                    timeout: 10000,

                    maximumAge: 0

                }

            );

        }


        // ==================================================
        // 11. CHECK NEARBY POTHOLES
        // ==================================================

        function checkNearbyPotholes(
            userLat,
            userLon,
            data
        ) {


            let nearbyPotholes = [];


            data.forEach(function(pothole) {


                const distance =
                    map.distance(

                        [userLat, userLon],

                        [
                            pothole.latitude,
                            pothole.longitude
                        ]

                    );


                // 50 metres

                if (distance <= 50) {

                    nearbyPotholes.push({

                        pothole: pothole,

                        distance: distance

                    });

                }

            });


            if (nearbyPotholes.length > 0) {


                const closest =
                    nearbyPotholes[0];


                const severity =
                    getSeverityText(
                        closest.pothole.severity
                    );


                const message =
                    `Warning. ${severity} pothole detected approximately ${Math.round(closest.distance)} metres away.`;


                document.getElementById("status").innerText =
                    "⚠️ Pothole detected nearby";


                alert(
                    "⚠️ Pothole detected within 50 metres!"
                );


                speak(message);


            }

            else {


                document.getElementById("status").innerText =
                    "✅ No nearby potholes detected";

            }

        }


        // ==================================================
        // 12. ENABLE VOICE
        // ==================================================

        function enableVoice() {


            speak(
                "ShockMap voice alerts are now enabled."
            );


            document.getElementById("status").innerText =
                "🔊 Voice alerts enabled";

        }


        // ==================================================
        // 13. TEXT TO SPEECH
        // ==================================================

        function speak(message) {


            if (
                "speechSynthesis"
                in window
            ) {


                window.speechSynthesis.cancel();


                const speech =
                    new SpeechSynthesisUtterance(
                        message
                    );


                speech.rate = 1;

                speech.pitch = 1;

                speech.volume = 1;


                window.speechSynthesis.speak(
                    speech
                );

            }

        }


    </script>


</body>

</html>
